      summary: Create Connection
      operationId: create_connection_api_v1_connections_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Create Connection Api V1 Connections Post
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/connections/{connection_id}:
    get:
      tags:
      - connections
      summary: Get Connection
      operationId: get_connection_api_v1_connections__connection_id__get
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Connection Api V1 Connections  Connection Id  Get
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
    patch:
      tags:
      - connections
      summary: Reconnect
      description: Replace credentials (reconnect after an expired or revoked token).
        Paused destinations resume.
      operationId: reconnect_api_v1_connections__connection_id__patch
      parameters:
      - name: connection_id
        in: path
        required: true
        schema:
          type: string
          title: Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Reconnect Api V1 Connections  Connection Id  Patch
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/destinations:
    get:
      tags:
      - catalogue
      summary: List Destinations
      operationId: list_destinations_api_v1_destinations_get
      parameters:
