          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Confirm Rules Api V1 Destinations  Destination Id  Rules  Proposal
                  Id  Confirm Post
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/relevance:
    post:
      tags:
      - catalogue
      summary: Relevance
      description: Score destinations 1-5 against IncuBrix's audience with a short
