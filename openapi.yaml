      tags:
      - certification
      summary: List Certifications
      operationId: list_certifications_api_v1_certifications_get
      parameters:
      - name: destination_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Certifications Api V1 Certifications Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/recertification/run:
    post:
      tags:
      - certification
      summary: Run Recertification
      description: Re-test every certified destination last certified more than RECERT_AFTER_DAYS
        ago (also runs on a schedule).
      operationId: run_recertification_api_v1_recertification_run_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_run_recertification_api_v1_recertification_run_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
