          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
