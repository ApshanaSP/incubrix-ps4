openapi: 3.1.0
info:
  title: IncuBrix Long-Tail Distribution
  description: 'Connectors, posting rules, certification, catalogue tools, tailoring
    and recommendations for long-tail destinations. Errors are always {"error": {code,
    message, retryable, details}}.'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /connector/v1/{connector_key}/{method}:
    post:
      tags:
      - connector contract
      summary: Contract
      description: 'The IncuBrix connector contract. Methods: validate, publish, get_status,
        delete, fetch_metrics,

        refresh_auth, build_assist_pack. Errors use the shared codes from Appendix
        A.'
      operationId: contract_connector_v1__connector_key___method__post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      - name: method
        in: path
        required: true
        schema:
          type: string
          title: Method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCall'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Contract Connector V1  Connector Key   Method  Post
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/connector/{connector_key}/{method}:
    post:
      tags:
      - connector contract
      summary: Contract Alias
      description: Same as /connector/v1/{connector_key}/{method}, under /api/v1/.
      operationId: contract_alias_api_v1_connector__connector_key___method__post
      parameters:
      - name: connector_key
        in: path
        required: true
        schema:
          type: string
          title: Connector Key
      - name: method
        in: path
        required: true
        schema:
          type: string
          title: Method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCall'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Contract Alias Api V1 Connector  Connector Key   Method  Post
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/connectors:
    get:
      tags:
      - connectors
      summary: List Connectors
      operationId: list_connectors_api_v1_connectors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Connectors Api V1 Connectors Get
