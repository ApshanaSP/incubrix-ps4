    post:
      tags:
      - rules
      summary: Confirm Rules
      description: A person confirms (optionally correcting with overrides) or rejects
        the AI-proposed rules.
      operationId: confirm_rules_api_v1_destinations__destination_id__rules__proposal_id__confirm_post
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      - name: proposal_id
        in: path
        required: true
