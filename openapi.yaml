              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/destinations/{destination_id}/rules/capture:
    post:
      tags:
      - rules
      summary: Capture Rules
      description: 'An AI step reads the community''s rules page and proposes posting
        rules. They are NOT used until a person

        confirms them (POST .../rules/{proposal_id}/confirm); until then posting there
        is blocked.'
      operationId: capture_rules_api_v1_destinations__destination_id__rules_capture_post
      parameters:
      - name: destination_id
        in: path
        required: true
        schema:
          type: string
          title: Destination Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RulesCaptureIn'
