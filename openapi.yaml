          application/json:
            schema:
              $ref: '#/components/schemas/KillSwitchIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Kill Switch Api V1 Connectors  Connector Key  Kill
