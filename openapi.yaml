          - type: 'null'
          title: Surface
        content_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Id
      additionalProperties: true
      type: object
      title: Rendition
      description: One piece of content, already shaped for one destination.
    RulesCaptureIn:
      properties:
        rules_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Rules Url
        rules_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Rules Text
          description: Rules pasted by a person when the page cannot be fetched (robots.txt,
            login wall)
        provider:
          anyOf:
          - type: string
            enum:
            - mock
            - groq
            - gemini
          - type: 'null'
          title: Provider
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      title: RulesCaptureIn
    RulesDecisionIn:
      properties:
        decided_by:
          type: string
          title: Decided By
          description: Who reviewed the proposal
        overrides:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Overrides
        reject:
          type: boolean
          title: Reject
          default: false
      type: object
      required:
      - decided_by
      title: RulesDecisionIn
    SimFaultIn:
      properties:
        destination_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination Id
          description: Use this destination's mock instance
        platform:
          anyOf:
          - type: string
          - type: 'null'
          title: Platform
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
        kind:
          type: string
          enum:
          - timeout_after_create
          - timeout
          - rate_limit
          - quota_exhausted
          - auth_expired
          - reject
          - rename_field
          - revoke
          - server_error
          title: Kind
        op:
          type: string
          enum:
          - publish
          - status
          - delete
          - list
          - any
          title: Op
          default: publish
        count:
          type: integer
          title: Count
          default: 1
        retry_after:
          type: number
          title: Retry After
          default: 2
      type: object
      required:
      - kind
      title: SimFaultIn
    TailorIn:
      properties:
        content:
          $ref: '#/components/schemas/ContentItem'
        destination_ids:
          items:
            type: string
          type: array
          title: Destination Ids
      type: object
      required:
      - content
      - destination_ids
      title: TailorIn
    Translation:
      properties:
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
          default: ''
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
      type: object
      required:
      - title
      title: Translation
      description: The creator's own version of the item in another language (never
        machine-written here).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Needed only when API_TOKEN is set (the live demo); local runs need
        no token.
security:
- {}
- bearer: []
