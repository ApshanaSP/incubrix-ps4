                additionalProperties: true
                title: Response List Destinations Api V1 Destinations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - catalogue
      summary: Add Destination
      description: 'Add one destination: one catalogue row, no code. It must be certified
        before it is used.'
      operationId: add_destination_api_v1_destinations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DestinationIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Add Destination Api V1 Destinations Post
        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/destinations/{destination_id}:
