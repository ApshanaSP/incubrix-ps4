        default:
          description: Error
          content:
            application/json:
              example:
                error:
                  code: NOT_FOUND
                  message: destination dst_x not found
                  retryable: false
                  details: {}
  /api/v1/errors:
    get:
      tags:
      - connectors
      summary: List Errors
      operationId: list_errors_api_v1_errors_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response List Errors Api V1 Errors Get
