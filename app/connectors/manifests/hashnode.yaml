key: hashnode
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image, video_link]
    spec: {title_max_chars: 250, title_required: true, body_max_chars: 200000, links_allowed: true, max_tags: 5}
rate_limits:
  per_connection: {requests: 20, per_seconds: 60}
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
  UNAUTHENTICATED: CONNECTION_AUTH_EXPIRED
  BAD_USER_INPUT: PLATFORM_CONTENT_REJECTED
  NOT_FOUND: PLATFORM_CONTENT_REJECTED
instance_param: publication_id
credentials: [token]
destination_config: {publication_id: "Hashnode publication id", api_base_url: "Defaults to https://gql.hashnode.com"}
