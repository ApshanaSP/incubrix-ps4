key: assisted
version: 1.0.0
tier: assisted
auth: none
surfaces:
  - key: post
    content_types: [text, image, video, video_link, link]
    spec: {title_max_chars: 300, body_max_chars: 40000, links_allowed: true}
rate_limits:
  per_connection: {requests: 600, per_seconds: 60}
capabilities: [publish, status, delete, assist]
error_map: {}
instance_param: submit_url
credentials: []
destination_config: {submit_url: "Where a person posts it (prefilled where the site supports it)", submit_url_template: "optional, with {title} {url} {body} placeholders"}
