key: ghost
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: post
    content_types: [text, image, video_link]
    spec: {title_max_chars: 255, title_required: true, body_max_chars: 500000, links_allowed: true}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: base_url
credentials: [admin_api_key]
destination_config: {base_url: "Ghost site URL", status: "published (default) or draft"}
