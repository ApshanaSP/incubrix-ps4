key: devto
version: 1.0.0
tier: native
auth: api_key
surfaces:
  - key: article
    content_types: [text, image, video_link]
    spec: {title_max_chars: 128, title_required: true, body_max_chars: 100000, links_allowed: true, max_tags: 4, tag_pattern: "^[a-z0-9]{1,30}$"}
rate_limits:
  per_connection: {requests: 10, per_seconds: 30}
capabilities: [publish, status, delete, metrics]
error_map:
  "429": PLATFORM_RATE_LIMIT
  "422": PLATFORM_CONTENT_REJECTED
  "401": CONNECTION_AUTH_EXPIRED
  "403": CONNECTION_AUTH_EXPIRED
  "500": PLATFORM_UNAVAILABLE
  "503": PLATFORM_UNAVAILABLE
instance_param: api_base_url
credentials: [api_key]
destination_config: {api_base_url: "Defaults to https://dev.to (any Forem instance works)", organization_id: "optional"}
notes: The Forem API has no delete; delete unpublishes the article, which hides it from everyone.
