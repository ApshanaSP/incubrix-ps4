<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Sign in · IncuBrix Long-Tail</title>
<style>
:root {
  --bg: #f6f7fb; --panel: #ffffff; --text: #0f172a; --text-2: #334155; --muted: #64748b; --line: #e6e9f0;
  --brand: #4f46e5; --brand-soft: #eef2ff; --brand-ink: #3730a3; --bad: #b91c1c; --bad-soft: #fef2f2; --bad-line: #fecaca;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(1200px 600px at 20% -10%, #eef2ff 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #f5f3ff 0%, transparent 60%), var(--bg);
  color: var(--text); font: 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
.card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 16px 40px rgba(79, 70, 229, .10); }
.brand { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--brand), #8b5cf6); color: #fff; display: grid; place-items: center; font-weight: 800; }
.brand b { display: block; font-size: 16px; line-height: 1.2; } .brand span { color: var(--muted); font-size: 12.5px; }
h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 6px; }
p { margin: 0; color: var(--muted); font-size: 14.5px; }
label { display: block; font-size: 13.5px; font-weight: 650; color: var(--text-2); margin: 22px 0 6px; }
input { width: 100%; padding: 11px 13px; border: 1px solid #d6dce6; border-radius: 10px; font: inherit; color: var(--text); background: #fff; }
input:focus { outline: 3px solid #c7d2fe; border-color: #6366f1; }
button { width: 100%; margin-top: 16px; border: 0; border-radius: 11px; padding: 12px 18px; font: inherit; font-weight: 650; font-size: 15px;
  background: var(--brand); color: #fff; cursor: pointer; box-shadow: 0 1px 2px rgba(79, 70, 229, .3); }
button:hover { background: var(--brand-ink); } button:focus-visible { outline: 3px solid #c7d2fe; outline-offset: 2px; }
.error { display: none; margin-top: 18px; background: var(--bad-soft); border: 1px solid var(--bad-line); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.error.show { display: block; }
.note { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; }
code { background: #f1f5f9; border-radius: 5px; padding: 1px 6px; font-size: 12.5px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">IB</div><div><b>Long-Tail</b><span>by IncuBrix</span></div></div>
  <h1>Sign in to the demo</h1>
  <p>This demo is private. Enter the access token you were given to continue.</p>
  <div class="error" id="err" role="alert"></div>
  <form method="post" action="/login">
    <label for="token">Access token</label>
    <input type="password" id="token" name="token" autocomplete="current-password" required autofocus>
    <input type="hidden" name="next" id="next" value="/">
    <button type="submit">Sign in</button>
  </form>
  <p class="note">Using the API from a script? Send <code>Authorization: Bearer &lt;token&gt;</code> with each request.</p>
</main>
<script>
"use strict";
const q = new URLSearchParams(location.search);
document.getElementById("next").value = q.get("next") || "/";
const msg = { wrong: "That token isn't right. Check it and try again.",
              locked: "Too many wrong tokens. Wait a minute, then try again." }[q.get("error")];
if (msg) { const e = document.getElementById("err"); e.textContent = msg; e.classList.add("show"); }
</script>
</body>
</html>
